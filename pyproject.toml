[project]
name = "cozmo"
version = "0.1.0"
description = "Room scanning pipeline: photos / video / LiDAR -> dimensioned, stitched floor plan with damage + scope"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "jsonschema>=4.21",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
# Learned models for the photo/video tiers and damage detection.
models = [
    "torch>=2.2",
    "transformers>=4.45",
]
dev = ["pytest>=8"]

[project.scripts]
cozmo = "cozmo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cozmo*"]
